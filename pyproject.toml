[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "eightgen"
version = "0.1.0"
description = "Autonomous AI Agent that generates instant playable HTML5 games locally using Ollama"
authors = [
    { name = "8Gen Contributors" }
]
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "click>=8.1.0",
    "rich>=13.0.0",
    "httpx>=0.25.0",
    "jinja2>=3.1.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
]
smoke = [
    "playwright>=1.40.0",
]

[project.scripts]
8gen = "eightgen.cli.app:cli"
eightgen = "eightgen.cli.app:cli"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["eightgen*"]

[tool.setuptools.package-data]
eightgen = [
    "config/*.toml",
    "prompts/*.j2",
    "prompts/*/*.j2",
    "server/templates/*.html",
    "server/static/css/*.css",
    "server/static/js/*.js",
    "templates/*.html",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: tests that require external services (e.g. a local Ollama instance); skipped unless OLLAMA_INTEGRATION=1",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "B"]
ignore = ["E501", "B008"]

[tool.vercel]
entrypoint = "api.index:app"

