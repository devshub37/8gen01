# Bundled default configuration for 8Gen.
# Priority: CLI/programmatic overrides > environment (EIGHTGEN_*) > this file's
# user equivalent (./8gen.toml or ~/.config/eightgen/config.toml) > these defaults.
[llm]
# "auto" picks Gemini when an API key (EIGHTGEN_GEMINI_API_KEY / GEMINI_API_KEY)
# is configured, otherwise the local Ollama runtime. Set "gemini" or "ollama"
# to force a specific provider.
provider = "auto"
ollama_url = "http://localhost:11434"
model = "huihui_ai/qwen2.5-coder-abliterate:7b"
temperature = 0.7
timeout = 180.0
max_retries = 3

# Storage paths intentionally left unset: the code default is platform-aware
# (./games locally, /tmp/8gen/games inside Vercel's serverless runtime).
[server]
host = "127.0.0.1"
port = 8000
auto_open = true

[ui]
theme = "dark"
stream_output = true
